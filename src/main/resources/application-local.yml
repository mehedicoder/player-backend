spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/playerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${LOCAL_DB_USERNAME:player}
    password: ${LOCAL_DB_PASSWORD:player}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      timeout: ${LOCAL_REDIS_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${LOCAL_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

server:
  shutdown: graceful

auth:
  session:
    ttl: ${AUTH_SESSION_TTL:PT30M}
  login-rate-limit:
    max-attempts: ${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    window: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:PT5M}
