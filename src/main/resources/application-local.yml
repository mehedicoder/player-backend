spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/playerdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${LOCAL_DB_USERNAME:player}
    password: ${LOCAL_DB_PASSWORD:player}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      timeout: ${LOCAL_REDIS_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${LOCAL_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

leaderboard:
  consumer:
    group-id: ${LEADERBOARD_CONSUMER_GROUP_ID:leaderboard-update-consumer-v1}
    topic: ${LEADERBOARD_CONSUMER_TOPIC:player-activity-events.v1}
    concurrency: ${LEADERBOARD_CONSUMER_CONCURRENCY:1}
    retry-max-attempts: ${LEADERBOARD_CONSUMER_RETRY_MAX_ATTEMPTS:3}
    retry-initial-interval-ms: ${LEADERBOARD_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
    retry-max-interval-ms: ${LEADERBOARD_CONSUMER_RETRY_MAX_INTERVAL_MS:1000}
    max-payload-bytes: ${LEADERBOARD_CONSUMER_MAX_PAYLOAD_BYTES:65536}
    max-score-delta: ${LEADERBOARD_CONSUMER_MAX_SCORE_DELTA:1000000}

match-result:
  consumer:
    group-id: ${MATCH_RESULT_CONSUMER_GROUP_ID:match-result-consumer-v1}
    topic: ${MATCH_RESULT_CONSUMER_TOPIC:match-results.v1}
    dlq-topic: ${MATCH_RESULT_CONSUMER_DLQ_TOPIC:match-results.v1.dlq}
    concurrency: ${MATCH_RESULT_CONSUMER_CONCURRENCY:1}
    retry-max-attempts: ${MATCH_RESULT_CONSUMER_RETRY_MAX_ATTEMPTS:3}
    retry-initial-interval-ms: ${MATCH_RESULT_CONSUMER_RETRY_INITIAL_INTERVAL_MS:500}
    retry-max-interval-ms: ${MATCH_RESULT_CONSUMER_RETRY_MAX_INTERVAL_MS:1000}
    max-payload-bytes: ${MATCH_RESULT_CONSUMER_MAX_PAYLOAD_BYTES:65536}
    max-score-delta: ${MATCH_RESULT_CONSUMER_MAX_SCORE_DELTA:1000}

notification:
  worker:
    enabled: ${NOTIFICATION_WORKER_ENABLED:true}
    batch-size: ${NOTIFICATION_WORKER_BATCH_SIZE:10}
    max-attempts: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:4}
    fixed-delay-ms: ${NOTIFICATION_WORKER_FIXED_DELAY_MS:1000}
    processing-timeout-seconds: ${NOTIFICATION_WORKER_PROCESSING_TIMEOUT_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

server:
  shutdown: graceful

auth:
  session:
    ttl: ${AUTH_SESSION_TTL:PT30M}
  login-rate-limit:
    max-attempts: ${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
    window: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:PT5M}
